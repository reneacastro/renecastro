<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>René Castro</title>
  <meta name="description" content="renecastro.com.br">
  <style>
    :root {
      --bg: #0f1115;
      --fg: #f4f4f5;
      --muted: #9aa0aa;
      --accent: #7c9cff;
      --line: rgba(255,255,255,.08);
    }
    @media (prefers-color-scheme: light) {
      :root { --bg:#fafafa; --fg:#18181b; --muted:#6b7280; --accent:#3b5bdb; --line:rgba(0,0,0,.08); }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    main { max-width: 440px; text-align: center; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent); display: inline-block; margin-bottom: 28px;
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    h1 { font-size: clamp(28px, 7vw, 44px); font-weight: 700; letter-spacing: -.02em; margin: 0 0 10px; }
    p { color: var(--muted); margin: 0 0 6px; }
    .domain { font-size: 14px; letter-spacing: .04em; }
    footer { margin-top: 40px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
    a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <span class="dot" aria-hidden="true"></span>
    <h1>René Castro</h1>
    <p>Em construção — em breve, algo bom por aqui.</p>
    <p class="domain">renecastro.com.br</p>
    <footer>Hospedado no GitHub Pages · Registro.br</footer>
  </main>
</body>
</html>
